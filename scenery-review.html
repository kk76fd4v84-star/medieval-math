<!doctype html><html><meta charset="utf-8"><title>Background walk-through</title><style>body{margin:0;background:#211c16;color:#edddba;font:16px Georgia}header{height:64px;display:flex;gap:16px;align-items:center;padding:0 16px}button,select{font:16px Georgia;padding:7px 12px;background:#edddba;color:#211c16;border:0}input{flex:1}iframe{border:0;width:100vw;height:calc(100vh - 64px)}#status{min-width:110px}</style><header><button id="play">Walk</button><select id="biome"><option value="0">Meadow</option><option value="1">Village</option><option value="2">Open woodland</option><option value="3">Rocky ground</option><option value="4">Canyon</option><option value="5">Meadow return</option></select><input id="pos" type="range" min="0" max="180000" value="0" step="1"><span id="status">Loading…</span><small id="build">Loading scale…</small><a href="./?biome=sketchbook&amp;mode=knight" style="color:inherit">Play the sketchbook</a><a href="./" style="color:inherit">Back to game</a></header><iframe src="./?debug&v=clean-ink-1" id="game"></iframe><script>
const f=document.querySelector('iframe'),slider=document.querySelector('#pos'),label=document.querySelector('#status');let game,walking=false,last=0;
const setup=setInterval(()=>{const w=f.contentWindow;if(!w.__km||w.document.querySelector('#kmLoader'))return;game=w;document.querySelector('#build').textContent='Clean ink';game.__km.debugJump('tavern');game.__km.setSpeed(0);game.__km.S.view=null;game.__km.S.enc=null;game.__km.S.mode='sceneryReview';game.__km.S.swaps={};game.__km.S.timers=[];game.document.querySelector('#hud').style.display='none';game.document.querySelector('#panel').innerHTML='';game.__km.S.voices=[];game.__km.S.actors=[];game.__km.S.graves=[];game.__km.S.camX=0;clearInterval(setup);label.textContent='Ready';const initial=new URLSearchParams(location.search).get('biome');if(initial!==null&&Number(initial)>=0&&Number(initial)<6){document.querySelector('#biome').value=initial;document.querySelector('#biome').dispatchEvent(new Event('change'));}},100);
document.querySelector('#play').onclick=()=>{walking=!walking;document.querySelector('#play').textContent=walking?'Pause':'Walk';};
document.querySelector('#biome').onchange=e=>{if(!game)return;const step=(game.KM_ART7.parallax.fields.size[0]-640)*game.KM_LAYOUT.art*(game.KM_DATA.scenery.mid.artScale||game.KM_DATA.scenery.terrainScale||1);const names=["fields","village","near-forest","barren-rocks","canyon","fields"];const choice=Number(e.target.value),route=game.KM_DATA.scenery.mid;const index=choice===5?3:route.biomes.indexOf(names[choice]);const cam=(index*route.segment*step+step/2-game.KM_LAYOUT.viewW/2)/route.speed;slider.value=Math.max(0,cam);};
function frame(t){if(game){if(walking)slider.value=(Number(slider.value)+Math.min(50,t-last)*.25)%Number(slider.max);game.__km.S.mode="sceneryReview";game.__km.S.enc=null;game.__km.S.camX=Number(slider.value);game.__km.S.walkT=t/1000;label.textContent=Math.round(Number(slider.value))+' units';}last=t;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
